<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>報告總目錄</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --border: rgba(11,11,11,0.10); --link: #2a78d6; --tag: rgba(42,120,214,0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --border: rgba(255,255,255,0.10); --link: #3987e5; --tag: rgba(57,135,229,0.18);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px 16px 56px; }
h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; }
.sub { color: var(--ink2); margin: 0 0 28px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
li a { display: block; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; color: inherit; text-decoration: none; }
li a:hover, li a:focus-visible { border-color: var(--link); }
.t { font-size: 17px; font-weight: 650; color: var(--link); }
.d { color: var(--ink2); margin-top: 2px; }
.m { color: var(--muted); font-size: 13px; margin-top: 8px; }
.tag { display: inline-block; background: var(--tag); color: var(--ink2); border-radius: 999px; padding: 0 9px; margin-right: 6px; }
footer { color: var(--muted); font-size: 12.5px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>報告總目錄</h1>
  <p class="sub">這裡收錄各種主題的分析報告，每份都是可以直接在瀏覽器開啟的獨立網頁。</p>

  <ul>
    <!-- 新報告加在最上面：複製一個 <li> 區塊，改連結、標題、說明與日期 -->
    <li>
      <a href="reports/poe_temple_watch_report.html">
        <div class="t">神廟時薪監看報告</div>
        <div class="d">Path of Exile 3.30 Covens 聯盟：以每小時市價比較六種 Temple of Atzoatl 賺錢做法的時薪，附 Atziri 掉落率列表與價格走勢。</div>
        <div class="m"><span class="tag">Path of Exile</span>資料期間 2026-11-26 至 2026-11-28</div>
      </a>
    </li>
  </ul>

  <footer>各報告是特定時間點的快照，內容不會自動更新。</footer>
</main>
</body>
</html>
